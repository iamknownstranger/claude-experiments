name: Release

on:
  push:
    branches:
      - main
      - claude/market-research-product-plan-uc5yg0

# Agents merge in bursts. Releases must serialize, and a queued release must
# never be cancelled — cancelling one loses the tag for those commits entirely.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: version, tag, release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.semver.outputs.released }}
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needed so semantic-release can push the version bump and tag.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          # Keep in step with .github/workflows/ci.yml — must be >= the uv that
          # wrote uv.lock (currently revision 3).
          version: "0.8.17"
          enable-cache: true

      - run: uv sync --all-extras

      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: semantic release
        id: semver
        # Derives the version from Conventional Commit subjects, bumps
        # __version__, writes CHANGELOG.md, commits, and tags.
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          root_options: "-vv"

      - name: publish GitHub release assets
        if: steps.semver.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.semver.outputs.tag }}

      - name: upload distributions
        if: steps.semver.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn

  pypi:
    name: publish to PyPI
    needs: release
    # Gated on an explicit opt-in, not just on the environment: GitHub creates a
    # referenced environment on demand, so an environment gate alone does not
    # hold the job back — it ran and failed `invalid-publisher` against a PyPI
    # project that does not exist yet. A permanently red job trains everyone to
    # ignore red, which is the exact habit this project exists to prevent.
    #
    # To turn publishing on: create the PyPI project with Trusted Publishing for
    # this repo + workflow + the `pypi` environment, then set the repository
    # variable PYPI_PUBLISH to "true".
    if: needs.release.outputs.released == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ratchet-ci
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: publish
        # OIDC Trusted Publishing — no long-lived token stored anywhere.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
