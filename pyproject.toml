[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ratchet-ci"
dynamic = ["version"]
description = "A merge gate that proves agent-authored PRs earned their green build"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ratchet contributors" }]
keywords = [
    "ai-agents",
    "code-review",
    "ci",
    "test-integrity",
    "reward-hacking",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
oracle = ["anthropic>=0.40", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/iamknownstranger/claude-experiments"
Issues = "https://github.com/iamknownstranger/claude-experiments/issues"

[project.scripts]
ratchet = "ratchet.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    # Release tooling lives in the lockfile, not in an unpinned action image.
    # The upstream action floated GitPython and broke on a removed attribute
    # mid-project; pinning it here makes releases reproducible.
    "python-semantic-release>=9.15",
    # GitPython dropped `Actor.name_email_regex` after 3.1.45 and
    # python-semantic-release still calls it, so an unconstrained resolve fails
    # every release with `type object 'Actor' has no attribute ...`. Pin until
    # upstream catches up. Dev-only: ratchet itself shells out to git.
    "gitpython<3.1.46",
]

[tool.hatch.version]
path = "src/ratchet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff
    "PTH",  # use pathlib
    "TID",  # tidy imports
]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # typer uses callables in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
# Corpus fixtures are deliberately bad code — they are the thing being detected.
"fixtures/**" = ["ALL"]
"tests/**" = ["N802", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["ratchet"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ratchet"]
warn_unreachable = true
disallow_any_generics = true
# Grammar packages are compiled C extensions and ship no stubs.
[[tool.mypy.overrides]]
module = ["tree_sitter_python.*", "tree_sitter_typescript.*", "tree_sitter_javascript.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "oracle: hits the Claude API; skipped unless ANTHROPIC_API_KEY is set",
    "corpus: runs against fixtures/corpus and enforces the precision gate",
]

[tool.coverage.run]
source = ["src/ratchet"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.semantic_release]
version_variables = ["src/ratchet/__init__.py:__version__"]
version_toml = []
commit_parser = "conventional"
build_command = "uv build"
major_on_zero = false
allow_zero_version = true
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|claude/market-research-product-plan-uc5yg0)"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]
